    3: { type: 'texto', title: '📖 Texto de Leitura (Dia 3)', content: `1. A Floresta Amazônica é a maior reserva florestal do nosso planeta.

    4: { type: 'math', title: '🧮 Desafio de Matemática (Dia 4)', content: `📐 Sistema Monetário e Multiplicação:

Lucas foi à feira escolar para comprar materiais de estudo:

    5: { type: 'texto', title: '📖 Texto de Leitura (Dia 5)', content: `1. Na Grécia Antiga, os mitos eram histórias para explicar o mundo.
2. A lenda de Ícaro conta sobre um jovem que sonhava em voar bem alto.

    6: { type: 'math', title: '🧮 Desafio de Matemática (Dia 6)', content: `📐 Frações e Divisão:

    7: { type: 'texto', title: '📖 Texto de Leitura (Dia 7)', content: `1. O Sol é a estrela central do nosso brilhante Sistema Solar.

    8: { type: 'math', title: '🧮 Desafio de Matemática (Dia 8)', content: `📐 Geometria e Perímetro:

    9: { type: 'texto', title: '📖 Texto de Leitura (Dia 9)', content: `1. Era uma vez uma formiga trabalhadora e uma cigarra muito cantora.

    10: { type: 'math', title: '🧮 Desafio de Matemática (Dia 10)', content: `📐 Operações com Números Grandes:

  // Função para carregar a tarefa de acordo com o dia do mês (1 a 31)
  function getTodayTask() {
    const day = new Date().getDate();
    // Se o dia não estiver cadastrado individualmente no objeto acima, faz um ciclo simples
    const taskKey = ((day - 1) % 10) + 1;
    return dailyTasks[taskKey] || dailyTasks[1];
  }

  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSound(type) {
    try {
      const ctx = getAudioContext();
      if (type === 'check') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } else if (type === 'uncheck') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } else if (type === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.12);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + index * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + index * 0.12 + 0.3);
          osc.start(ctx.currentTime + index * 0.12);
          osc.stop(ctx.currentTime + index * 0.12 + 0.3);
        });
      }
    } catch(e) {}
  }

  const dateInput = document.getElementById('current-date');
  const missionsList = document.getElementById('missions-list');
  const starCount = document.getElementById('star-count');
  const badgeContainer = document.getElementById('badge-container');
  const statusEl = document.getElementById('status');
  const lockNotice = document.getElementById('lock-notice');
  const finishBtn = document.getElementById('finish-day-btn');

  const reportModal = document.getElementById('report-modal');
  const reportBody = document.getElementById('report-body');

  const taskModal = document.getElementById('task-modal');
  const taskTitle = document.getElementById('task-title');
  const taskBodyContent = document.getElementById('task-body-content');
  const confirmTaskBtn = document.getElementById('confirm-task-btn');

  const resetBtn = document.getElementById('reset-today-btn');
  const rewardContent = document.getElementById('reward-content');
  const weeklyStarsLabel = document.getElementById('weekly-stars-label');

  // Ajuste do Fuso Horário Local (Meia-noite exata)
  const getTodayStr = () => {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  dateInput.value = getTodayStr();

  let activeUnsubscribe = null;
  let rewardUnsubscribe = null;
  let currentDayData = {};

  function getWeekRange(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay();
    const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
    
    const monday = new Date(d.setDate(diffToMonday));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    return {
      startStr: monday.toISOString().split('T')[0],
      endStr: sunday.toISOString().split('T')[0],
      weekId: `week_${monday.toISOString().split('T')[0]}`
    };
  }

  function loadMissionsForDate(dateStr) {
    if (activeUnsubscribe) activeUnsubscribe();

    const todayStr = getTodayStr();
    const isToday = (dateStr === todayStr);

    if (!isToday) {
      lockNotice.classList.add('active');
      resetBtn.style.display = 'none';
      finishBtn.style.display = 'none';
    } else {
      lockNotice.classList.remove('active');
      resetBtn.style.display = 'inline-block';
      finishBtn.style.display = 'flex';
    }

    const docRef = doc(db, "cadu_missions", dateStr);
    
    activeUnsubscribe = onSnapshot(docRef, (docSnap) => {
      statusEl.textContent = "⚡ Sincronizado em tempo real";
      currentDayData = docSnap.exists() ? docSnap.data() : {};
      renderMissions(dateStr, currentDayData, isToday);
      calculateWeeklyStars(dateStr);
    }, (error) => {
      statusEl.textContent = "❌ Erro ao conectar ao Firebase";
    });
  }

  function renderMissions(dateStr, data, isToday) {
    missionsList.innerHTML = '';
    let completedCount = 0;

    const todayTask = getTodayTask();
    const dynamicLabel = todayTask.type === 'texto' ? '📖 Leitura Diária (4º Ano)' : '🧮 Conta de Matemática (4º Ano)';

    const missionsData = [
      { id: 'mochila', label: '🎒 Agenda na Mochila' },
      { id: 'livros', label: '📚 Livros no Reforço' },
      { id: 'leitura', label: `${dynamicLabel} — Clique para abrir` }
    ];

    missionsData.forEach(m => {
      const isDone = !!data[m.id];
      if (isDone) completedCount++;

      const card = document.createElement('div');
      card.className = `mission-card ${isDone ? 'completed' : ''} ${!isToday ? 'disabled' : ''}`;
      card.innerHTML = `
        <span>${m.label}</span>
        <div class="checkbox">${isDone ? '✓' : ''}</div>
      `;

      if (isToday) {
        card.onclick = () => {
          if (m.id === 'leitura') {
            // Abre o modal pedagógico do dia
            taskTitle.textContent = todayTask.title;
            taskBodyContent.textContent = todayTask.content;
            taskModal.classList.add('active');
          } else {
            toggleMission(dateStr, data, m.id);
          }
        };
      }
      missionsList.appendChild(card);
    });

    starCount.textContent = completedCount;
  }

  async function toggleMission(dateStr, currentData, missionId) {
    if (dateStr !== getTodayStr()) return;

    const isCurrentlyDone = !!currentData[missionId];
    playSound(isCurrentlyDone ? 'uncheck' : 'check');

    const docRef = doc(db, "cadu_missions", dateStr);
    const updatedData = { ...currentData, [missionId]: !isCurrentlyDone };
    await setDoc(docRef, updatedData, { merge: true });
  }

  // Confirmação do Desafio Diário (Leitura/Matemática)
  confirmTaskBtn.onclick = async () => {
    taskModal.classList.remove('active');
    const todayStr = getTodayStr();
    if (dateInput.value !== todayStr) return;

    playSound('check');
    const docRef = doc(db, "cadu_missions", todayStr);
    await setDoc(docRef, { ...currentDayData, leitura: true }, { merge: true });
  };

  // Botão Concluir o Dia
  finishBtn.onclick = () => {
    playSound('victory');
    if (window.confetti) {
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }
    badgeContainer.classList.add('bounce');
    setTimeout(() => badgeContainer.classList.remove('bounce'), 300);
  };

  async function calculateWeeklyStars(dateStr) {
    const { startStr, endStr, weekId } = getWeekRange(dateStr);
    
    try {
      const querySnapshot = await getDocs(collection(db, "cadu_missions"));
      let totalWeeklyStars = 0;

      querySnapshot.forEach((doc) => {
        if (doc.id >= startStr && doc.id <= endStr) {
          const data = doc.data();
          ['mochila', 'livros', 'leitura'].forEach(mId => {
            if (data[mId]) totalWeeklyStars++;
          });
        }
      });

      weeklyStarsLabel.textContent = `Semana: ${totalWeeklyStars}/15 ⭐`;
      loadRewardState(weekId, totalWeeklyStars);

    } catch (e) {}
  }

  function loadRewardState(weekId, totalStars) {
    if (rewardUnsubscribe) rewardUnsubscribe();

    const rewardDocRef = doc(db, "cadu_rewards", weekId);
    
    rewardUnsubscribe = onSnapshot(rewardDocRef, (docSnap) => {
      const rewardData = docSnap.exists() ? docSnap.data() : { request: '', status: 'pending' };
      renderRewardUI(weekId, totalStars, rewardData);
    });
  }

  function renderRewardUI(weekId, totalStars, rewardData) {
    const isUnlocked = totalStars >= 15;

    if (!isUnlocked) {
      const missing = 15 - totalStars;
      rewardContent.innerHTML = `
        <p style="margin: 0; font-size: 0.9rem; color: #94a3b8;">
          🔒 Meta ainda não atingida. Faltam <strong>${missing} estrelas</strong> nesta semana para desbloquear o pedido do fim de semana!
        </p>
      `;
      return;
    }

    let statusBadge = `<span class="status-pill status-pending">⏳ Aguardando Análise</span>`;
    if (rewardData.status === 'approved') {
      statusBadge = `<span class="status-pill status-approved">🟢 Aprovado pelos Pais!</span>`;
    } else if (rewardData.status === 'rejected') {
      statusBadge = `<span class="status-pill status-rejected">🔴 Pedir Ajuste</span>`;
    }

    rewardContent.innerHTML = `
      <div>
        <label style="font-size: 0.85rem; color: #cbd5e1; display: block; margin-bottom: 6px;">
          Qual recompensa o Cadu quer no fim de semana?
        </label>
        <div class="reward-input-group">
          <input type="text" id="reward-input" class="reward-input" placeholder="Ex: Passear no parque, ver filme..." value="${rewardData.request || ''}">
          <button class="reward-btn-save" id="save-reward-btn">Enviar</button>
        </div>
      </div>
      <div class="parent-controls">
        <div>${statusBadge}</div>
        <div style="display: flex; gap: 6px;">
          <button class="btn-approve" id="approve-btn">👍 Aprovar</button>
          <button class="btn-reject" id="reject-btn">👎 Negar</button>
        </div>
      </div>
    `;

    document.getElementById('save-reward-btn').onclick = async () => {
      const text = document.getElementById('reward-input').value;
      if (!text.trim()) return;
      await setDoc(doc(db, "cadu_rewards", weekId), { request: text, status: 'pending' }, { merge: true });
      playSound('check');
    };

    document.getElementById('approve-btn').onclick = async () => {
      await setDoc(doc(db, "cadu_rewards", weekId), { status: 'approved' }, { merge: true });
      playSound('victory');
    };

    document.getElementById('reject-btn').onclick = async () => {
      await setDoc(doc(db, "cadu_rewards", weekId), { status: 'rejected' }, { merge: true });
      playSound('uncheck');
    };
  }

  resetBtn.onclick = async () => {
    const todayStr = getTodayStr();
    if (dateInput.value !== todayStr) return;

    const resetData = { mochila: false, livros: false, leitura: false };
    const docRef = doc(db, "cadu_missions", todayStr);
    await setDoc(docRef, resetData);
    playSound('uncheck');
  };

  async function generateMonthlyReport() {
    reportBody.innerHTML = `<p style="text-align: center;">Buscando histórico na nuvem...</p>`;
    const selectedDate = new Date(dateInput.value);
    const currentYearMonth = dateInput.value.substring(0, 7);

    try {
      const querySnapshot = await getDocs(collection(db, "cadu_missions"));
      let totalStars = 0;
      let totalDaysTracked = 0;
      let fullDays = 0;

      querySnapshot.forEach((doc) => {
        if (doc.id.startsWith(currentYearMonth)) {
          totalDaysTracked++;
          const data = doc.data();
          let dayStars = 0;
          ['mochila', 'livros', 'leitura'].forEach(mId => {
            if (data[mId]) dayStars++;
          });
          totalStars += dayStars;
          if (dayStars === 3) fullDays++;
        }
      });

      const maxPossibleStars = totalDaysTracked * 3;
      const successRate = maxPossibleStars > 0 ? Math.round((totalStars / maxPossibleStars) * 100) : 0;
      const monthName = selectedDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

      reportBody.innerHTML = `
        <p style="text-align: center; font-weight: bold; text-transform: capitalize; color: var(--accent); margin-top:0;">${monthName}</p>
        <div class="stat-box"><span>Dias Registrados:</span><strong>${totalDaysTracked} dias</strong></div>
        <div class="stat-box"><span>Estrelas Conquistadas:</span><strong>${totalStars} ⭐</strong></div>
        <div class="stat-box"><span>Dias com 100% das Missões:</span><strong>${fullDays} 🎯</strong></div>
        <div class="stat-box"><span>Taxa de Sucesso:</span><strong>${successRate}%</strong></div>
      `;
    } catch (err) {
      reportBody.innerHTML = `<p style="color: #ef4444; text-align: center;">Erro ao carregar relatório.</p>`;
    }
  }

  document.getElementById('open-report-btn').onclick = () => {
    reportModal.classList.add('active');
    generateMonthlyReport();
  };
  document.getElementById('close-modal-btn').onclick = () => reportModal.classList.remove('active');
  document.getElementById('close-task-btn').onclick = () => taskModal.classList.remove('active');

  reportModal.onclick = (e) => { if (e.target === reportModal) reportModal.classList.remove('active'); };
  taskModal.onclick = (e) => { if (e.target === taskModal) taskModal.classList.remove('active'); };

  dateInput.addEventListener('change', (e) => loadMissionsForDate(e.target.value));
  loadMissionsForDate(dateInput.value);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
